<svg class="chart" [attr.viewBox]="viewBox" preserveAspectRatio="none" role="img" aria-label="Revenue over the last 7 days">
  <defs>
    <linearGradient id="revenueFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--color-primary)" stop-opacity="0.28" />
      <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0" />
    </linearGradient>
  </defs>
  <path class="chart-area" [attr.d]="areaPath()" fill="url(#revenueFill)" />
  <path class="chart-line" [attr.d]="linePath()" fill="none" />
  @for (point of points(); track point.label) {
    <circle class="chart-dot" [attr.cx]="point.x" [attr.cy]="point.y" r="3.5">
      <title>{{ point.label }}: {{ point.revenue | currency: 'USD' : 'symbol' : '1.0-0' }}</title>
    </circle>
  }
</svg>
<div class="chart-axis">
  @for (point of points(); track point.label) {
    <span>{{ point.label }}</span>
  }
</div>
